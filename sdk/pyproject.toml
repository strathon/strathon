[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strathon"
version = "1.3.0"
description = "Open-source AI agent firewall. Blocks dangerous agent tool calls before they execute, with in-process CEL enforcement at the tool-call boundary."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Strathon", email = "hello@getstrathon.com"}]
requires-python = ">=3.11"
keywords = ["ai", "agents", "firewall", "security", "llm", "opentelemetry", "cel", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    # These two floors are held down by a ceiling in the crewai extra,
    # not left stale. crewai pins opentelemetry-api~=1.42.0 and
    # pydantic<2.13, and the values below are the highest releases those
    # ranges admit -- 1.42.1 and 2.12.5, not the .0 of each line. Raising
    # either further makes strathon[crewai] and strathon[all]
    # unresolvable. Installed separately, the receiver runs opentelemetry
    # 1.44 and pydantic 2.13.
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "cel-python>=0.5.0",
]

[project.optional-dependencies]
openai = ["openai>=2.48.0"]
openai-agents = ["openai-agents>=0.18.3"]
anthropic = ["anthropic>=0.119.0"]
claude-agent = ["claude-agent-sdk>=0.2.126", "anthropic>=0.119.0"]
langchain = ["langchain-core>=1.5.1"]
langgraph = ["langchain-core>=1.5.1"]
crewai = ["crewai>=1.15.5"]
autogen = ["autogen-agentchat>=0.7.5"]
pydantic-ai = ["pydantic-ai-slim>=2.17.0"]
google-adk = ["google-adk>=2.5.0"]
all = [
    "openai>=2.48.0",
    "openai-agents>=0.18.3",
    "anthropic>=0.119.0",
    "claude-agent-sdk>=0.2.126",
    "langchain-core>=1.5.1",
    "crewai>=1.15.5",
    "autogen-agentchat>=0.7.5",
    "pydantic-ai-slim>=2.17.0",
    "google-adk>=2.5.0",
]
dev = [
    # Same toolchain and the same reasoning as receiver/pyproject.toml;
    # the two are kept identical so a contributor gets one answer.
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
]

[project.urls]
Homepage = "https://getstrathon.com"
Repository = "https://github.com/strathon/strathon"
Documentation = "https://getstrathon.com/docs"
Issues = "https://github.com/strathon/strathon/issues"
Discord = "https://discord.gg/Ta9XRmh4H"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strathon = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
# Agent frameworks are optional dependencies and most ship without type stubs.
# We instrument them at runtime via lazy imports; their absence from the type
# environment is expected, not a defect in our code.
ignore_missing_imports = true

# The instrumentation adapters work by reassigning framework methods
# (monkey-patching) — that is the supported interception mechanism, not an
# accident. mypy flags every such assignment as [method-assign]; we disable
# that code ONLY for the adapter modules, so a stray method reassignment
# anywhere else in the SDK still surfaces.
[[tool.mypy.overrides]]
module = "strathon.instrumentation.*"
disable_error_code = ["method-assign"]
