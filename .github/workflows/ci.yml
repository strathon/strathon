name: CI

# Run on every push to any branch, every PR against main. Manual trigger
# (workflow_dispatch) available for re-runs without a code change.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight runs on the same branch when a new push lands.
# Saves CI minutes and gives faster feedback on the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions default to read-only at the workflow level. Individual
# jobs grant additional permissions only when they need them.
permissions:
  contents: read

jobs:
  # ============================================================
  # Secret scan. Stdlib-only, no deps, fast. Mirrors the local
  # pre-commit hook.
  # ============================================================
  secret-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files for secrets
        run: python scripts/check_secrets.py --all
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bandit static security scan
        run: |
          pip install -r requirements-ci.txt
          bandit -r receiver/ sdk/src/ cli/ scripts/ \
            -x '*/tests/*,*/test_*.py' -c .bandit -q

  # ============================================================
  # SDK unit tests — matrixed across supported Python versions.
  # No Postgres dependency; the SDK does not touch a DB directly.
  # ============================================================
  sdk-tests:
    name: SDK tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/pyproject.toml

      # crewai declares requires-python <3.14, so `.[all]` cannot resolve on
      # 3.14 at all. Every other framework extra supports it. Install the
      # extras where they resolve and the core alone on 3.14, which still
      # proves the SDK itself runs there; the optional-framework tests skip
      # cleanly via pytest.importorskip. Fold 3.14 back into the line below
      # when crewai widens its range.
      - name: Install SDK with all framework extras
        if: matrix.python-version != '3.14'
        working-directory: sdk
        run: |
          python -m pip install --upgrade pip
          # Install with all framework extras so every integration test
          # can actually exercise its framework
          pip install -e ".[all]" pytest pytest-asyncio

      - name: Install SDK core only (3.14)
        if: matrix.python-version == '3.14'
        working-directory: sdk
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run SDK tests
        working-directory: sdk
        run: pytest tests/ -v --tb=short

      # A contributor's first command is `pip install -e ".[dev]"`, not
      # `[all]`. Optional-framework tests must SKIP when the extra is absent,
      # never fail -- otherwise that first run is a wall of
      # ModuleNotFoundError. CI only ever installed [all], so nothing caught
      # this; guard the contributor path explicitly. Fresh venv so the
      # framework extras installed above cannot mask a missing guard.
      - name: SDK tests without framework extras (contributor install path)
        if: matrix.python-version == '3.12'
        working-directory: sdk
        run: |
          python -m venv /tmp/sdk-noextras
          /tmp/sdk-noextras/bin/pip install --quiet --upgrade pip
          /tmp/sdk-noextras/bin/pip install --quiet -e ".[dev]"
          /tmp/sdk-noextras/bin/pytest tests/ -q

  # ============================================================
  # Receiver tests — needs Postgres for the retention DB tests.
  # Python 3.12 only because the receiver requires >= 3.12.
  # ============================================================
  receiver-tests:
    name: Receiver tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strathon
          POSTGRES_PASSWORD: strathon_dev
          POSTGRES_DB: strathon
        ports:
          - 5432:5432
        # pg_isready health-checks the container; the job won't start
        # this step's container until it reports healthy.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: receiver/pyproject.toml

      - name: Install receiver dependencies
        working-directory: receiver
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply database migrations
        working-directory: receiver
        env:
          DATABASE_URL: postgresql://strathon:strathon_dev@127.0.0.1:5432/strathon
          # The integration tests authenticate with the seeded development
          # key, which migration 003 only creates when this is set.
          STRATHON_SEED_DEV_KEY: "true"
        run: alembic upgrade head

      - name: Run receiver tests
        working-directory: receiver
        env:
          DATABASE_URL: postgresql://strathon:strathon_dev@127.0.0.1:5432/strathon
        run: pytest tests/ -v --tb=short

  # ============================================================
  # Cross-framework parity integration tests — boots a real receiver
  # subprocess and exercises LangGraph/CrewAI/OAI Agents against it.
  # ============================================================
  integration-tests:
    name: Cross-framework parity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strathon
          POSTGRES_PASSWORD: strathon_dev
          POSTGRES_DB: strathon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install all components
        run: |
          python -m pip install --upgrade pip
          # SDK with all framework extras so the parity test can drive
          # LangGraph, CrewAI, and OpenAI Agents SDK
          pip install -e "./sdk[all]"
          # Receiver so the integration conftest can launch it as a subprocess
          pip install -e "./receiver"
          # Plus the integration test's direct dependency
          pip install psycopg pytest pytest-asyncio

      - name: Apply database migrations
        working-directory: receiver
        env:
          DATABASE_URL: postgresql://strathon:strathon_dev@127.0.0.1:5432/strathon
          # The integration tests authenticate with the seeded development
          # key, which migration 003 only creates when this is set.
          STRATHON_SEED_DEV_KEY: "true"
        run: alembic upgrade head

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://strathon:strathon_dev@127.0.0.1:5432/strathon
        run: pytest tests/ -v --tb=short

  # ============================================================
  # Egress proxy tests — run in the proxy's OWN dependency set, not the
  # receiver's. The addon ships as a separate image (docs/egress-locking.md)
  # because mitmproxy caps cryptography and typing-extensions below what the
  # receiver requires. Installing receiver[dev] here leaves mitmproxy absent,
  # pytest.importorskip skips the whole module, and all ten tests silently do
  # not run — which is what happened before this job existed. cel-python is
  # explicit: without it every policy raises inside the evaluator and the
  # addon must fail closed rather than allow.
  # ============================================================
  egress-proxy-tests:
    name: Egress proxy tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the proxy dependency set
        run: |
          python -m pip install --upgrade pip
          pip install "mitmproxy>=12.2.3" httpx "cel-python>=0.5.0" \
            pydantic pydantic-settings pytest pytest-asyncio
          pip check

      - name: Run egress proxy tests
        working-directory: receiver
        run: pytest tests/test_egress_proxy.py -v

  # ============================================================
  # Docker build verification — proves the receiver image actually
  # builds. Catches Dockerfile regressions before they hit users on
  # quickstart. We don't push the image anywhere yet (no registry
  # process); that lands with the release pipeline.
  # ============================================================
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build receiver image
        uses: docker/build-push-action@v7
        with:
          context: ./receiver
          push: false
          load: true
          tags: strathon-receiver:ci
          # Layer cache stored in the GitHub Actions cache for fast rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image can start
        run: |
          # Sanity-check that the entrypoint resolves and python imports work.
          # We can't actually serve here (no Postgres in this job), so just
          # confirm the container starts and main.py imports cleanly.
          docker run --rm --entrypoint python strathon-receiver:ci \
            -c "import main; print('receiver module imports OK')"

  # ============================================================
  # Dashboard build — type-check, lint, and build the Next.js
  # dashboard on every push. The dashboard image is otherwise only
  # built on a release tag, so a broken build would not surface until
  # tagging. next build runs the type-check and the lint, so this is
  # the full validation.
  # ============================================================
  dashboard-build:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install and build
        working-directory: dashboard
        run: |
          npm ci
          npm run build

  # ============================================================
  # Lint — fast, runs in parallel with everything. Catches obvious
  # style / unused-import issues before review.
  # ============================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install -r requirements-ci.txt

      - name: Run ruff check
        run: ruff check .

  # ============================================================
  # CEL attribute drift — fails if any doc example or policy template
  # references a CEL attribute the engine never emits. A policy using a
  # non-emitted attribute silently never matches, the same false-confidence
  # failure class as silent enforcement gaps. Stdlib-only, no deps, fast.
  # ============================================================
  cel-attributes:
    name: CEL attribute drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check referenced CEL attributes are all emitted
        run: python scripts/check_cel_attributes.py

      - name: Check documented dependency versions match the code
        run: python scripts/check_doc_versions.py

  # ============================================================
  # SDK type check — BLOCKING. The SDK passes mypy clean: a scoped
  # [tool.mypy] config in sdk/pyproject.toml ignores optional-framework
  # missing imports and the intentional method-assign monkey-patching in the
  # instrumentation adapters; everything else must type-check. Two real bugs
  # were found and fixed while making this clean (a non-existent pydantic-ai
  # enum member, and a google-adk callback signature mismatch), which is why
  # it is worth gating on.
  typecheck-sdk:
    name: Type check — SDK (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install SDK with dev deps
        run: |
          python -m pip install --upgrade pip
          # Install only the SDK's own dependencies. The mypy config treats
          # optional frameworks as missing-import Any (we instrument them via
          # lazy runtime imports, not their static types), so the framework
          # extras are not needed here and only make mypy follow their
          # transitive deps. One of those, numpy via crewai, ships 3.12-only
          # stub syntax that aborts the run under the SDK's 3.11 mypy target.
          # Framework behavior is covered by the sdk-tests matrix.
          pip install -e "./sdk[dev]"
      - name: mypy (SDK)
        working-directory: sdk
        run: mypy src/strathon/

  # Receiver type check — BLOCKING. The receiver passes mypy clean after a
  # triage pass that fixed the real issues (the heartbeat_missed and
  # sdk_integrity_violation alerts both passed a null project_id/session and so
  # never dispatched; several reused-variable and Optional-narrowing bugs) and
  # scoped only the genuine framework false positives (re2 missing stubs, async
  # CursorResult.rowcount, mitmproxy follow-imports) in receiver/pyproject.toml.
  typecheck-receiver:
    name: Type check — receiver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install receiver with dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "./receiver[dev]"
      - name: mypy (receiver)
        working-directory: receiver
        run: mypy .

  # ============================================================
  # Docker — build and push to ghcr.io on version tags (v*)
  # ============================================================
  docker:
    name: Docker image
    needs: [secret-scan, sdk-tests, receiver-tests, integration-tests, docker-build, dashboard-build, lint, cel-attributes, typecheck-sdk, typecheck-receiver]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        image:
          - { name: receiver, context: ./receiver }
          - { name: dashboard, context: ./dashboard }
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive image version (strip leading v from the git tag)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/strathon/${{ matrix.image.name }}:latest
            ghcr.io/strathon/${{ matrix.image.name }}:${{ steps.ver.outputs.version }}
